[package]
name = "app-launcher"
version = "0.1.0"
description = ""
authors = [""]
license = "MIT"
edition = "2024"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
crossterm = "0.28.1"
ratatui = "0.29.0"
